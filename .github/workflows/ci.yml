name: ci

on:
  pull_request:
  push:
    branches: [main, "mbono/work"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  image:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/mbono/work'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image=ghcr.io/mockshox/external-dns-webhook-directadmin
          {
            echo "tags<<EOF"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
            else
              echo "${image}:work"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/external-dns-webhook-directadmin" \
            -f visibility=public
