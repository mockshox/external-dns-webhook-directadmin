name: ci

on:
  pull_request:
  push:
    branches: [main, "mbono/work"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  image:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/mbono/work'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=work,enable=${{ github.ref == 'refs/heads/mbono/work' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Require a semantic version tag
        if: startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version == ''
        run: |
          echo "::error::${GITHUB_REF_NAME} is not a semantic version. Use vMAJOR.MINOR.PATCH."
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          # /user/packages is the token's own user. GITHUB_TOKEN is the
          # Actions bot, so that route is 404. The package belongs to the
          # repository owner.
          kind=$(gh api "/users/${OWNER}" --jq .type)
          if [ "${kind}" = "Organization" ]; then
            path="/orgs/${OWNER}/packages/container/${PACKAGE}"
          else
            path="/users/${OWNER}/packages/container/${PACKAGE}"
          fi
          if gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "${path}" \
            -f visibility=public; then
            exit 0
          fi
          echo "::warning::Could not mark ${OWNER}/${PACKAGE} public. Set the package visibility to public once in GitHub."
